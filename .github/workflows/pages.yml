name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # manual redeploy — use this after publishing a chapter
  schedule:
    - cron: '0 6 * * *'       # daily rebuild so new Supabase chapters appear

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build static site
        env:
          STATIC: '1'
          NEXT_PUBLIC_STATIC: '1'
          # Project site (user.github.io/repo) needs the repo name as a base path.
          # For a user/org site (user.github.io) leave BASE_PATH empty.
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          # Optional: set these to prerender your public catalogue into the site.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
